<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <title>if-else Internal: Ongkos Kirim </title>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <script type="text/javascript">
        var iBerat;
        var sEkspres;
        iBerat = prompt("Masukkan berat barang (dalam kg).", 0);
        sEkspres = prompt("Apakah pengiriman ekspres? (Y)a atau (T)idak", "T");
        if (iBerat > 5) {
            if (sEkspres == "Y") {
                alert("Ongkos kirim: Rp. 50.000(Ekspres)");
            } else {
                alert("Ongkos kirim: Rp. 30.000(Reguler)");
            }
        } else {
            if (sEkspres == "Y") {
                alert("Ongkos kirim: Rp. 25.000(Ekspres)");
            } else {
                alert("Ongkos kirim: Rp. 12.000(Reguler)");
            }
        }
    </script>
</head>
<body>
    <h1>if-else Internal: Ongkos Kirim </h1>
    <p>Reload halaman untuk mencoba lagi.</p>
</body>
</html>
