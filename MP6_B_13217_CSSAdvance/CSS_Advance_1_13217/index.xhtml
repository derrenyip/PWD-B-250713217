<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
	<head>
		<meta http-equiv="Content-Type" content="application/xhtml+xml; charset=UTF-8" />
		<title>Pendaftaran Anggota Baru Organisasi</title>
		<link rel="stylesheet" type="text/css" href="style.css" />
	</head>
	<body>
		<div id="wrapper">
			<div id="branding">
				<h1>Pendaftaran Anggota Baru</h1>
				<p>Isi data di bawah ini dengan lengkap, lalu kirim untuk bergabung bersama kami.</p>
			</div>

			<form action="" method="post" enctype="multipart/form-data">
				<table id="formTable">
					<tr class="hlRow">
						<th colspan="2">Data Diri</th>
					</tr>
					<tr class="regRow">
						<td><label for="nama">Nama lengkap</label></td>
						<td><input type="text" id="nama" name="nama" size="30" /></td>
					</tr>
					<tr class="regRow">
						<td><label for="nim">NIM</label></td>
						<td><input type="text" id="nim" name="nim" size="30" /></td>
					</tr>
					<tr class="regRow">
						<td><label for="prodi">Program studi</label></td>
						<td>
							<select id="prodi" name="prodi">
								<option value="TI">Teknik Informatika</option>
								<option value="SI">Sistem Informasi</option>
								<option value="TIN">Teknik Industri</option>
							</select>
						</td>
					</tr>
					<tr class="regRow">
						<td><label for="semester">Semester saat ini</label></td>
						<td>
							<select id="semester" name="semester">
								<option>Semester 1</option>
								<option>Semester 2</option>
								<option>Semester 3</option>
								<option>Semester 4</option>
								<option>Semester 5</option>
								<option>Semester 6</option>
								<option>Semester 7</option>
								<option>Semester 8</option>
							</select>
						</td>
					</tr>
					<tr class="regRow">
						<td>Jenis kelamin</td>
						<td>
							<input type="radio" id="laki" name="kelamin" value="laki" />
							<label for="laki" class="inline">Laki-laki</label>
							<input type="radio" id="perempuan" name="kelamin" value="perempuan" />
							<label for="perempuan" class="inline">Perempuan</label>
						</td>
					</tr>

					<tr class="hlRow">
						<th colspan="2">Kontak</th>
					</tr>
					<tr class="regRow">
						<td><label for="email">Email aktif</label></td>
						<td><input type="email" id="email" name="email" size="30" /></td>
					</tr>
					<tr class="regRow">
						<td><label for="telepon">No. HP / WhatsApp</label></td>
						<td><input type="text" id="telepon" name="telepon" size="30" /></td>
					</tr>

					<tr class="hlRow">
						<th colspan="2">Minat dan Pengalaman</th>
					</tr>
					<tr class="regRow">
						<td>Divisi pilihan</td>
						<td>
							<input type="radio" id="acara" name="divisi" value="Acara" />
							<label for="acara" class="inline">Acara</label>
							<input type="radio" id="sdm" name="divisi" value="SDM" />
							<label for="sdm" class="inline">SDM</label>
							<input type="radio" id="humas" name="divisi" value="Humas" />
							<label for="humas" class="inline">Humas</label>
							<input type="radio" id="media" name="divisi" value="Media" />
							<label for="media" class="inline">Media</label>
						</td>
					</tr>
					<tr class="regRow">
						<td class="top">Riwayat kegiatan dan keahlian</td>
						<td>
							<fieldset>
								<legend>Pernah terlibat dalam</legend>
								<input type="checkbox" id="kepanitiaan" name="pengalaman" value="Kepanitiaan" />
								<label for="kepanitiaan" class="inline">Kepanitiaan</label>
								<input type="checkbox" id="organisasi" name="pengalaman" value="Organisasi" />
								<label for="organisasi" class="inline">Organisasi</label>
								<input type="checkbox" id="volunteer" name="pengalaman" value="Volunteer" />
								<label for="volunteer" class="inline">Volunteer</label>
							</fieldset>
							<fieldset>
								<legend>Keahlian yang dimiliki</legend>
								<input type="checkbox" id="publicspeaking" name="kemampuan" value="Public Speaking" />
								<label for="publicspeaking" class="inline">Public Speaking</label>
								<input type="checkbox" id="desain" name="kemampuan" value="Desain" />
								<label for="desain" class="inline">Desain</label>
								<input type="checkbox" id="fotografi" name="kemampuan" value="Fotografi" />
								<label for="fotografi" class="inline">Fotografi</label>
							</fieldset>
						</td>
					</tr>
					<tr class="regRow">
						<td class="top"><label for="alasan">Motivasi bergabung</label></td>
						<td><textarea id="alasan" name="alasan" rows="6" cols="30"></textarea></td>
					</tr>
					<tr class="regRow">
						<td><label for="cv">Unggah CV (PDF)</label></td>
						<td><input type="file" id="cv" name="cv" accept="application/pdf" /></td>
					</tr>
					<tr class="regRow">
						<td colspan="2" class="center">
							<input type="submit" name="daftar" value="Kirim Pendaftaran" />
						</td>
					</tr>
				</table>
			</form>

			<div id="footer">Pastikan seluruh data sudah benar sebelum dikirim.</div>
		</div>
	</body>
</html>
